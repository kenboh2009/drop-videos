<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drop動画リンク集</title>
<link rel="icon" href="assets/drop-icon.jpg">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="ソフトバレーチームDropの練習・大会の動画と写真のリンク集">
<style>
  :root {
    --bg: #F3F6F8;
    --surface: #FFFFFF;
    --surface-2: #EAF0F4;
    --ink: #16202B;
    --ink-muted: #5B6B78;
    --accent: #E2572B;
    --accent-contrast: #FFFFFF;
    --line: #D7E0E6;
    --radius: 14px;
    --font-body: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Segoe UI", system-ui, sans-serif;
    --font-mono: ui-monospace, "SFMono-Regular", Consolas, Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10171F;
      --surface: #17212B;
      --surface-2: #1D2833;
      --ink: #EAF1F6;
      --ink-muted: #93A4B2;
      --accent: #FF7A4D;
      --accent-contrast: #17212B;
      --line: #2A3742;
    }
  }

  :root[data-theme="dark"] {
    --bg: #10171F;
    --surface: #17212B;
    --surface-2: #1D2833;
    --ink: #EAF1F6;
    --ink-muted: #93A4B2;
    --accent: #FF7A4D;
    --accent-contrast: #17212B;
    --line: #2A3742;
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.55;
    padding: 0 0 40px;
  }

  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 20px;
  }

  header.hero {
    padding: 20px 20px 10px;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    text-align: left;
    gap: 10px;
  }

  .team-name {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 0.02em;
    margin: 0;
    text-wrap: balance;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .team-name .ball {
    width: 30px;
    height: 30px;
    object-fit: cover;
    border-radius: 8px;
    flex-shrink: 0;
    box-shadow: 0 0 0 1px var(--line);
  }

  .team-sub {
    font-size: 15px;
    color: var(--ink-muted);
    font-weight: 600;
    letter-spacing: 0.04em;
  }

  main {
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  h2.group-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-muted);
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin: 0 0 8px;
  }

  h2.group-title::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  /* --- 年別フィルタ --- */
  .filter-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    margin: 0 0 8px;
  }

  .filter-btn {
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--ink-muted);
    cursor: pointer;
    transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
  }

  .filter-btn:hover { border-color: var(--accent); color: var(--ink); }

  .filter-btn[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-contrast);
  }

  .filter-count {
    margin-left: auto;
    font-size: 12.5px;
    color: var(--ink-muted);
    font-variant-numeric: tabular-nums;
  }

  .card-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }

  .card-main {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: nowrap;
    flex: 1;
    min-width: 0;
  }

  img.thumb {
    width: 56px;
    height: 35px;
    object-fit: cover;
    border-radius: 6px;
    flex-shrink: 0;
    box-shadow: 0 0 0 1px var(--line);
    background: var(--surface-2);
  }

  .card-text {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: nowrap;
    flex: 1;
    min-width: 0;
  }

  .card-date {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 12.5px;
    color: var(--ink-muted);
    background: var(--surface-2);
    border-radius: 6px;
    padding: 3px 8px;
    flex-shrink: 0;
  }

  /* イベント名が長いときは、途中で省略して1行に収める */
  .card-title {
    font-size: 15.5px;
    font-weight: 700;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }

  .links {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 10px;
    border-radius: 999px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--ink);
    text-decoration: none;
    font-size: 12px;
    font-weight: 600;
    transition: transform 0.12s ease, border-color 0.12s ease;
  }

  .chip:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
  }

  .chip svg { width: 12px; height: 12px; flex-shrink: 0; }
  .chip.video svg { color: var(--accent); }
  .chip.photo svg { color: var(--ink-muted); }

  /* 講評は動画とは性質が違う(読み物)ので、塗りつぶして明確に分ける。 */
  .chip.review {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-contrast);
    font-weight: 700;
    margin-left: 5px;
  }
  .chip.review svg { color: var(--accent-contrast); }
  .chip.review:hover { border-color: var(--accent); opacity: .88; }

  /* まだ公開していない講評。ふつうに押しても開かない(長押しで開く)。 */
  .chip.review.coming-soon {
    background: var(--surface-2);
    border-color: var(--line);
    color: var(--ink-muted);
    font-weight: 600;
    position: relative;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;   /* 長押しでiOSのメニューが出るのを防ぐ */
  }
  .chip.review.coming-soon svg { color: var(--ink-muted); }
  .chip.review.coming-soon:hover { border-color: var(--line); opacity: 1; }
  /* 長押し中に伸びる進捗の帯 */
  .chip.review.coming-soon::before {
    content: "";
    position: absolute; left: 0; top: 0; bottom: 0;
    width: var(--hold, 0%);
    background: var(--accent);
    opacity: .22;
    transition: width .1s linear;
  }
  .chip.review.coming-soon > * { position: relative; }

  .empty {
    color: var(--ink-muted);
    font-size: 14px;
    padding: 16px 4px;
  }

  /* --- 練習(日ごとに開く) --- */
  details.practice {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }
  details.practice > summary {
    list-style: none;
    cursor: pointer;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  details.practice > summary::-webkit-details-marker { display: none; }
  details.practice > summary:hover { background: var(--surface-2); }

  .practice-title { font-size: 15.5px; font-weight: 700; }
  .practice-count { color: var(--ink-muted); font-size: 13px; }

  /* 「押すと開く」の案内。開いた後は用済みなので消す。 */
  .practice-hint {
    margin-left: auto;
    color: var(--accent);
    font-size: 12.5px;
    font-weight: 700;
    white-space: nowrap;
  }
  details.practice[open] .practice-hint { display: none; }
  /* 案内が出ている間は、矢印を右端から少し内側に寄せる */
  details.practice:not([open]) .caret { margin-left: 8px; }
  @media (max-width: 420px) {
    .practice-hint { font-size: 11.5px; }
  }

  /* 開閉の矢印 */
  .caret {
    margin-left: auto;
    flex-shrink: 0;
    color: var(--ink-muted);
    transition: transform 0.15s ease;
  }
  .caret svg { width: 16px; height: 16px; display: block; }
  details.practice[open] .caret { transform: rotate(90deg); }

  .day-list { border-top: 1px solid var(--line); }

  .day {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
  }
  .day:last-child { border-bottom: none; }
  .day:hover { background: var(--surface-2); }

  .day-text {
    display: flex;
    /* サムネイルを入れたので、文字のベースラインではなく上下中央で揃える */
    align-items: center;
    gap: 8px;
    flex-wrap: nowrap;
    min-width: 0;
  }
  /* 練習の行のサムネイルは、大会の行より少し小さめにする */
  .day-text .thumb { width: 44px; height: 28px; }
  /* 練習名が長いときは、途中で省略して1行に収める */
  .day-label {
    font-size: 14.5px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }

  .day .links { flex-wrap: wrap; }
  .day .chip { padding: 4px 9px; font-size: 11.5px; }

  .day-text { flex: 1; }
  .day-videos { justify-content: flex-end; }

  /* 講評は動画とは別の列。無い日も幅を確保して、縦に揃えて見えるようにする。 */
  .day-review {
    flex-shrink: 0;
    width: 110px;
    display: flex;
    justify-content: flex-end;
  }
  .chip.review { margin-left: 0; }

  .day-review:empty { display: none; }

  /* けんぴーHP でだけ開ける管理画面へのリンク。目立たせる必要はない。 */
  .admin-link {
    display: inline-block;
    margin-top: 6px;
    color: var(--ink-muted);
    text-decoration: none;
    font-size: 11.5px;
    opacity: .55;
  }
  .admin-link:hover { opacity: 1; color: var(--accent); }

  footer {
    max-width: 760px;
    margin: 20px auto 0;
    padding: 12px 20px;
    border-top: 1px solid var(--line);
    color: var(--ink-muted);
    font-size: 12.5px;
    text-align: center;
  }

  @media (max-width: 480px) {
    .filter-count { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>

<header class="hero">
  <h1 class="team-name">
    <img class="ball" src="assets/drop-icon.jpg" alt="">
    Drop
  </h1>
  <div class="team-sub">ソフトバレーチーム 動画・写真リンク集</div>

<div class="wrap">

<footer>随時更新 · このページのURLをチームで共有してご利用ください<br><span id="updated"></span>
  <!-- 管理画面はけんぴーHPの中だけで動いている。他の人が押しても何も表示されない。
       以前は http://localhost:8787 と書いていたが、これは「けんぴーHP自身で開いたとき」
       にしか正しく繋がらない(localhostは開いている端末自身を指すため)。
       けんぴーPixel等、同じ家のLANにいる端末からも繋がるよう、
       けんぴーHPの固定IP(ルーターでMACアドレスに紐づけ済み)に変更した(2026-08-19)。 -->
  <br><a class="admin-link" href="http://192.168.0.12:8787" target="_blank" rel="noopener">管理</a>
</footer>

<script>
  const iconVideo = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9.5"></circle><path d="M10 8.5L16 12L10 15.5V8.5Z" fill="currentColor" stroke="none"></path></svg>';
  const iconPhoto = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2.5"></rect><circle cx="8.5" cy="10" r="1.8"></circle><path d="M4 17l4.5-5 3.5 4 3-2.5L20 17"></path></svg>';

  const iconReview = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3.5h9.5L19 8v12.5H5V3.5Z"></path><path d="M14 3.5V8h5"></path><path d="M8.5 13h7M8.5 16.5h4.5"></path></svg>';

  const fallbackThumb = "assets/drop-icon.jpg";

  // Drop!練習。常設コレクションから独立させ、練習日ごとに選べるようにしたもの。
  // 同じ日に複数のカメラ(Falcon = XBotGo の定点、GoPro など)がある日は動画を並べる。
  const practicePlaylist = "https://www.youtube.com/playlist?list=PLUTpvcTnAowdnav0_-O7P8cx_rl_SJqYq";

  const practiceDays = [
    { date: "2026/08/08", label: "くぬぎ台小学校 道場破り錬", videos: [{ name: "動画", id: "xZiFJFsI5cE" }] },
    { date: "2026/08/01", label: "Drop錬", reviewSoon: "kouhyou/20260801.html",
      videos: [{ name: "動画", id: "7jHipM13_IE" }] },
    { date: "2026/07/25", label: "練習", review: "kouhyou/20260725.html",
      videos: [{ name: "メイン動画", id: "s8C9jfAcxgo" }, { name: "サブ動画", id: "EijMzowXRkw" }] },
    { date: "2026/07/18", label: "練習", review: "kouhyou/20260718.html",
      videos: [{ name: "動画", id: "8hG5M69iUE4" }] },
    { date: "2026/07/11", label: "練習", videos: [{ name: "動画", id: "gVxT2RqwOx8" }] },
    { date: "2026/07/04", label: "練習", review: "kouhyou/20260704.html",
      videos: [{ name: "動画", id: "vR3vXw5qlLs" }] },
    { date: "2026/06/20", label: "練習", videos: [{ name: "動画", id: "wlIHaKx_Pao" }] },
    { date: "2026/06/13", label: "練習", review: "kouhyou/20260613.html",
      videos: [{ name: "動画", id: "6af5_sazj8o" }] },
    { date: "2026/06/06", label: "練習(こもりんの誕生日)",
      videos: [
        { name: "メイン動画", id: "1u3BuIMz8L0" },
        { name: "サブ動画①", id: "G_1MAtVyERM" },
        { name: "サブ動画②", id: "9eJMYOJFfyA" },
        { name: "誕生日・じゃんけん", id: "U9L0rN6fII0" }
      ] }
  ];

  const evergreen = [
    { title: "Drop公式試合ファインプレー集", video: "https://www.youtube.com/playlist?list=PLG93nQ7O-WOo", thumb: "thumbs/ev-01.jpg" },
    { title: "Drop!合宿", video: "https://www.youtube.com/playlist?list=PLJ7pCa6M_-j8", photo: "https://photos.app.goo.gl/mkm8Eg88DwBsZaMs7", thumb: "thumbs/ev-02.jpg" },
    { title: "Drop25thyear", photo: "https://photos.app.goo.gl/25v6etQ6R7iLJDyF9" }
  ];

  const events = [
    { date: "2026/06/27", title: "港北区ソフバ大会", video: "https://www.youtube.com/playlist?list=PLc3dZitUeYCg", photo: "https://photos.app.goo.gl/iszy8P3AXFjzrFht9", thumb: "thumbs/ev-e-00.jpg" },
    { date: "2026/06/21", title: "青葉区ソフバ大会", video: "https://www.youtube.com/playlist?list=PLUTpvcTnAoweDMHvLpkw-OzCtipgKxe_T", thumb: "thumbs/ev-e-01.jpg" },
    { date: "2026/05/31", title: "DropAKY 全国予選兼春季ソフバ大会 in 厚木", video: "https://youtube.com/playlist?list=PLSBV2Tgk67cQ&si=5hYrGzJ0NLhG5JFX", thumb: "thumbs/ev-e-02.jpg" },
    { date: "2026/02/15", title: "中区ソフバ大会", video: "https://youtube.com/playlist?list=PLCATEjcNzT6Y&si=s61s0A1Nt1b8cozF", photo: "https://photos.app.goo.gl/mabgTHGsJWpYFWKV7", thumb: "thumbs/ev-e-03.jpg" },
    { date: "2026/02/01", title: "青葉区ソフトバレー大会", video: "https://youtube.com/playlist?list=PLRrBISefDqQE&si=j9isqPrhRmF9X9pv", photo: "https://photos.app.goo.gl/676nh1NrGTwdJMiA9", thumb: "thumbs/ev-e-04.jpg" },
    { date: "2025/10/25", title: "青葉区ソフトバレー大会", video: "https://youtube.com/playlist?list=PLVuSicxXtGLs&si=WQLUzDqD5JhAvSXl", photo: "https://photos.app.goo.gl/Sib7zwCovmqM4TzB9", thumb: "thumbs/ev-e-05.jpg" },
    { date: "2025/09/27", title: "都筑区ソフトバレー交流会", video: "https://youtube.com/playlist?list=PLUES7bJi5h9s&si=rwOFdClbJyYtp-p6", photo: "https://photos.app.goo.gl/Kiwiff2P2mq52C9C9", thumb: "thumbs/ev-e-06.jpg" },
    { date: "2025/07/20", title: "Drop夏キャンプ", photo: "https://photos.app.goo.gl/7u5Wib4sLERov2Cr9", thumb: "thumbs/ev-e-07.jpg" },
    { date: "2025/06/28", title: "港北区ソフトバレー大会", video: "https://youtube.com/playlist?list=PLEQUowePQCwQ&si=lja15Tu7f8U7WZvs", photo: "https://photos.app.goo.gl/V6UzMU9k9GXbiwkz5", thumb: "thumbs/ev-e-08.jpg" },
    { date: "2025/06/22", title: "青葉区ソフトバレー大会", video: "https://youtube.com/playlist?list=PLDmBgXSYXYO4&si=Ux-QzZL6NiB_5jip", photo: "https://photos.app.goo.gl/fg5zKutMG4ZsYegT6", thumb: "thumbs/ev-e-09.jpg" },
    { date: "2025/04/19", title: "Drop!相模原試合", video: "https://youtube.com/playlist?list=PLaNlZobrtzAU&si=kMEBfHhAWDRfBINF", photo: "https://photos.app.goo.gl/eGvDzvZNb7uXA9bTA", thumb: "thumbs/ev-e-10.jpg" },
    { date: "2024/11/09", title: "青葉区ソフトバレー大会", video: "https://youtube.com/playlist?list=PLEjEroAD7FN8&si=K22vLUdMqGfRky5B", photo: "https://photos.app.goo.gl/N2hj5gSC13cHcMT7A", thumb: "thumbs/ev-e-11.jpg" },
    { date: "2024/09/28", title: "Drop!都筑みどり合同ソフトバレー大会", video: "https://www.youtube.com/playlist?list=PLAPg1JgT_9_k", photo: "https://photos.app.goo.gl/Urchcc6Hu6jJWkWG7", thumb: "thumbs/ev-e-12.jpg" },
    { date: "2023/06/24", title: "Drop都筑区大会 in 都筑区スポーツセンター", video: "https://www.youtube.com/playlist?list=PLWbGvJ-tvAkw", thumb: "thumbs/ev-e-13.jpg" }
  ];

  function chip(label, url, type) {
    const icon = type === "video" ? iconVideo : type === "review" ? iconReview : iconPhoto;
    return `<a class="chip ${type}" href="${url}" target="_blank" rel="noopener">${icon}<span>${label}</span></a>`;
  }

  // まだ公開していない講評。押しても何も起きず「Coming soon」と出るだけだが、
  // **5秒長押しすると開く。** けんぼうが外出先(スマホ)から下書きを確認するための入口で、
  // 家のLANの中でしか開けない管理画面の代わりになる(2026-08-19)。
  function comingSoonChip(url) {
    return `<a class="chip review coming-soon" href="${url}" target="_blank" rel="noopener"
       data-hold="${url}">${iconReview}<span>講評 Coming soon</span></a>`;
  }

  function card(item) {
    const dateBadge = item.date ? `<span class="card-date">${item.date}</span>` : "";
    let links = "";
    if (item.video) links += chip("YouTube", item.video, "video");
    if (item.photo) links += chip("Google Photos", item.photo, "photo");
    if (item.review) links += chip("講評を読む", item.review, "review");
    else if (item.reviewSoon) links += comingSoonChip(item.reviewSoon);
    const thumbSrc = item.thumb || fallbackThumb;
    return `
      <div class="card">
        <div class="card-main">
          <img class="thumb" src="${thumbSrc}" alt="" loading="lazy">
          <div class="card-text">
            ${dateBadge}
            <span class="card-title">${item.title}</span>
          </div>
        </div>
        <div class="links">${links}</div>
      </div>
    `;
  }

  const iconCaret = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 5l7 7-7 7"></path></svg>';

  // 練習日ひとつぶん。動画が複数あるときはカメラごとに並べる。
  //
  // 並び順は「大会・試合記録」と揃えて サムネイル → 日付 → タイトル にしてある
  // (2026-08-19、けんぼうの指摘)。サムネイルはその日の1本目の動画のものを
  // YouTube から借りる。またタイトルは、ほとんどの日が単に「練習」で情報が無いので、
  // **「練習」以外の名前が付いている日だけ**出す。
  function day(d) {
    const videos = d.videos
      .map((v) => chip(v.name, `https://www.youtube.com/watch?v=${v.id}`, "video"))
      .join("");
    // 講評は動画とは別の列に置く。無い日も列だけ残して、縦に揃えて見えるようにする。
    const review = d.review ? chip("講評を読む", d.review, "review")
      : d.reviewSoon ? comingSoonChip(d.reviewSoon) : "";
    const thumb = d.videos.length
      ? `<img class="thumb" src="https://i.ytimg.com/vi/${d.videos[0].id}/mqdefault.jpg" alt="" loading="lazy">`
      : "";
    const label = d.label && d.label !== "練習"
      ? `<span class="day-label">${d.label}</span>` : "";
    return `
      <div class="day">
        <div class="day-text">
          ${thumb}
          <span class="card-date">${d.date}</span>
          ${label}
        </div>
        <div class="links day-videos">${videos}</div>
        <div class="day-review">${review}</div>
      </div>
    `;
  }

  function practiceBlock() {
    return `
      <details class="practice">
        <summary>
          <img class="thumb" src="thumbs/ev-00.jpg" alt="" loading="lazy">
          <span class="practice-title">Drop!練習</span>
          <span class="practice-count">${practiceDays.length}回ぶん</span>
          <!-- 「>」だけでは押せることが伝わらなかったので、言葉でも書く(2026-08-19) -->
          <span class="practice-hint">押すと一覧が開きます</span>
          <span class="caret">${iconCaret}</span>
        </summary>
        <div class="day-list">${practiceDays.map(day).join("")}</div>
      </details>
      <p class="empty" style="padding:10px 4px 0; font-size:13px">
        再生リストをまとめて開く場合は
        <a href="${practicePlaylist}" target="_blank" rel="noopener">こちら</a>。
      </p>
    `;
  }

  // 大会・試合記録に含まれる年を新しい順に集める
  const years = [...new Set(events.map((e) => e.date.slice(0, 4)))].sort().reverse();
  let activeYear = "all";

  function filterBar() {
    const btn = (value, label) =>
      `<button type="button" class="filter-btn" data-year="${value}" aria-pressed="${activeYear === value}">${label}</button>`;
    const buttons = [btn("all", "すべて"), ...years.map((y) => btn(y, y))].join("");
    const shown = activeYear === "all" ? events.length : events.filter((e) => e.date.startsWith(activeYear)).length;
    return `<div class="filter-bar">${buttons}<span class="filter-count">${shown}件</span></div>`;
  }

  function eventsInner() {
    const shownEvents = activeYear === "all" ? events : events.filter((e) => e.date.startsWith(activeYear));
    const eventList = shownEvents.length
      ? `<div class="card-list">${shownEvents.map(card).join("")}</div>`
      : `<p class="empty">この年の記録はまだありません。</p>`;
    return filterBar() + eventList;
  }

  function render() {
    document.getElementById("app").innerHTML = `
      <section>
        <h2 class="group-title">練習</h2>
        ${practiceBlock()}
      </section>
      <section>
        <h2 class="group-title">常設コレクション</h2>
        <div class="card-list">${evergreen.map(card).join("")}</div>
      </section>
      <section>
        <h2 class="group-title">大会・試合記録</h2>
        <div id="events-body">${eventsInner()}</div>
      </section>
    `;
  }

  document.getElementById("app").addEventListener("click", (e) => {
    const btn = e.target.closest(".filter-btn");
    if (!btn) return;
    activeYear = btn.dataset.year;
    // 全体を描き直すと「Drop!練習」の開閉が閉じてしまうので、この節だけ入れ替える。
    document.getElementById("events-body").innerHTML = eventsInner();
  });

  render();

  // --- 「講評 Coming soon」の長押し ---
  //
  // まだ公開前の講評を、けんぼうが外出先(スマホ)から確認するための入口。
  // ふつうに押しても開かず、5秒押し続けたときだけ開く。押している間は
  // ボタンの中に帯が伸びて、あとどれくらいかが分かるようにしてある。
  (function () {
    var HOLD_MS = 5000;
    var timer = null, raf = null, target = null, startX = 0, startY = 0;

    function reset() {
      if (timer) { clearTimeout(timer); timer = null; }
      if (raf) { cancelAnimationFrame(raf); raf = null; }
      if (target) { target.style.setProperty("--hold", "0%"); target = null; }
    }

    function start(e) {
      var a = e.target.closest && e.target.closest(".coming-soon");
      if (!a) return;
      e.preventDefault();          // ふつうの click では開かせない
      reset();
      target = a;
      startX = e.clientX; startY = e.clientY;
      var began = Date.now();

      (function tick() {
        if (!target) return;
        var pct = Math.min(100, (Date.now() - began) / HOLD_MS * 100);
        target.style.setProperty("--hold", pct + "%");
        raf = requestAnimationFrame(tick);
      })();

      timer = setTimeout(function () {
        var url = a.dataset.hold;
        reset();
        window.open(url, "_blank", "noopener");
      }, HOLD_MS);
    }

    document.addEventListener("pointerdown", start);
    document.addEventListener("pointerup", reset);
    document.addEventListener("pointercancel", reset);
    // 注意: document への pointerleave / 細かい pointermove の監視はしない。
    // マウスのわずかな動きでも中断してしまい、PCでは事実上押せなくなるため
    // (2026-08-19、けんぴーHPで長押しできない不具合の原因はこれだった)。
    // 代わりに「押し始めた位置から大きく離れたか」だけを見る。
    document.addEventListener("pointermove", function (e) {
      if (!target) return;
      if (Math.abs(e.clientX - startX) > 40 || Math.abs(e.clientY - startY) > 40) reset();
    });
    // 長押ししても click では飛ばない(上で preventDefault しているが念のため)
    document.addEventListener("click", function (e) {
      if (e.target.closest && e.target.closest(".coming-soon")) e.preventDefault();
    });
    // スマホの長押しメニューを出さない
    document.addEventListener("contextmenu", function (e) {
      if (e.target.closest && e.target.closest(".coming-soon")) e.preventDefault();
    });
  })();

  // 内容を更新したらこの日付も書き換える
  document.getElementById("updated").textContent = "最終更新: 2026/08/16";
</script>

</body>
</html>
