  const 集める = (名, id) => {
    const 誰 = 群[名] || [名]; const cnt = new Float32Array(nx * ny); let n = 0, k = 0;
    for (const m of 誰) { const o = 人.get(m)?.f[id]; if (!o) continue; const a = o[1]; let s = 0; for (let i = 1; i < a.length; i += 2) s += a[i]; if (!(s > 0)) continue; k++; n += o[0]; }
    for (const m of 誰) { const o = 人.get(m)?.f[id]; if (!o) continue; const a = o[1]; let s = 0; for (let i = 1; i < a.length; i += 2) s += a[i]; if (!(s > 0)) continue; for (let i = 0; i < a.length; i += 2) cnt[a[i]] += a[i + 1] / s / k; }
    return { n, 人数: k, cnt, 平均: !!群[名] };
  };
  const 見出し = [...new Set(D.図.map((f) => f[1]))];
  const out = document.getElementById('out');
  out.innerHTML = 見出し.map((h) => '<h2>' + esc(h) + '</h2><div class="grid">' + D.図.filter((f) => f[1] === h).map((f) => '<div class="card c' + f[5] + '" id="f-' + esc(f[0]) + '"><div class="hd"><span class="t"><small>' + esc(f[1]) + '</small> ' + esc(f[2]) + '</span><span class="n"><span class="flag">サンプル少</span> <b class="k"></b> ラリー<span class="p"></span></span></div><div class="bd"><div class="mini"><canvas width="' + MW + '" height="' + MH + '"></canvas><span>' + esc(f[2].replace(/^\S+\s*/, '')) + '</span></div><canvas class="big" width="' + W + '" height="' + H + '"></canvas></div><div class="leg">少<i></i>多</div></div>').join('') + '</div>').join('');
  // 位置図(どの位置の図か)は人によらないので、最初に1回だけ描く
  for (const f of D.図) {
    const el = document.getElementById('f-' + f[0]), m = el.querySelector('.mini canvas').getContext('2d'), K = MS * 2, mx2 = (u) => (u - U0) * K, my = (d) => (d - D0) * K;
    m.fillStyle = '#2f3b4a'; m.fillRect(0, 0, MW, MH); m.fillStyle = '#3a4a5c'; m.fillRect(mx2(-3.05), my(0), 6.1 * K, 6.7 * K);
    m.strokeStyle = '#fff'; m.lineWidth = 2; m.strokeRect(mx2(-3.05), my(0), 6.1 * K, 6.7 * K); m.lineWidth = 5; m.beginPath(); m.moveTo(mx2(-3.45), my(0)); m.lineTo(mx2(3.45), my(0)); m.stroke();
    const 点たち = f[3] === '相' ? D.基準.map((b) => [b[0], b[1], b[2]]) : [['サーブ', 0, 7.7], ['左', -1.5, 3.4], ['右', 1.5, 3.4]];
    for (const [k, u, d] of 点たち) { const 対象 = k === f[4]; m.beginPath(); m.arc(mx2(u), my(d), (対象 ? 1.05 : 0.8) * K, 0, 7); if (対象) { m.fillStyle = '#f0641a'; m.fill(); m.strokeStyle = '#fff'; m.lineWidth = 3; m.stroke(); } else { m.strokeStyle = 'rgba(255,255,255,.75)'; m.lineWidth = 1.5; m.stroke(); } }
  }
  const 描く = (名) => {
    document.getElementById('who').textContent = 名;
    for (const f of D.図) {
      const el = document.getElementById('f-' + f[0]), r = 集める(名, f[0]);
      el.classList.toggle('few', r.n < D.最少);
      el.querySelector('.k').textContent = r.n; el.querySelector('.p').innerHTML = r.平均 ? ' ・ <b>' + r.人数 + '</b>人' : '';
      const sm = new Float32Array(nx * ny);
      for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) { let s = 0; for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) { const a = i + di, b = j + dj; if (a < 0 || b < 0 || a >= nx || b >= ny) continue; s += r.cnt[b * nx + a] * ((di === 0 && dj === 0) ? 4 : (di === 0 || dj === 0) ? 2 : 1); } sm[j * nx + i] = s / 16; }
      let mx = 0; for (const v of sm) if (v > mx) mx = v;
      const c = el.querySelector('canvas.big').getContext('2d');
      c.fillStyle = '#2f3b4a'; c.fillRect(0, 0, W, H);
      c.fillStyle = '#3a4a5c'; c.fillRect(px(-3.05), py(0), 6.1 * PX, 6.7 * PX);
      if (f[3] === '相') {   // 陣形の基準点のまわりを薄く強調
        const 点 = D.基準.find((b) => b[0] === f[4]);
        c.fillStyle = 'rgba(255,255,255,0.16)'; c.beginPath(); c.arc(px(点[1]), py(点[2]), 1.0 * PX, 0, 7); c.fill();
        c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 1.5; c.setLineDash([6, 5]); c.stroke(); c.setLineDash([]);
      } else if (f[4] === '左' || f[4] === '右') {
        const 領 = { 左: [-3.05, 0, 0, 6.7], 右: [0, 3.05, 0, 6.7] }[f[4]];
        c.fillStyle = 'rgba(255,255,255,0.12)'; c.fillRect(px(領[0]), py(領[2]), (領[1] - 領[0]) * PX, (領[3] - 領[2]) * PX);
      }
      if (mx > 0) for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
        const v = sm[j * nx + i] / mx; if (v < 0.04) continue;
        const xa = -X0 + i * 格, ya = Y0 - j * 格, u = -ya, d = -(xa + 格);
        if (u + 格 < U0 || u > U1 || d + 格 < D0 || d > D1) continue;
        const [R, G, B] = 色(Math.sqrt(v)); c.fillStyle = 'rgba(' + R + ',' + G + ',' + B + ',0.92)'; c.fillRect(px(u), py(d), 格 * PX + 1, 格 * PX + 1);
      }
      c.strokeStyle = '#fff'; c.lineWidth = 3; c.strokeRect(px(-3.05), py(0), 6.1 * PX, 6.7 * PX);
      c.lineWidth = 1.5; c.setLineDash([8, 6]); c.beginPath();
      if (f[3] === '自' && (f[4] === '左' || f[4] === '右')) { c.moveTo(px(0), py(0)); c.lineTo(px(0), py(6.7)); }
      c.stroke(); c.setLineDash([]);
      c.lineWidth = 7; c.beginPath(); c.moveTo(px(-3.45), py(0)); c.lineTo(px(3.45), py(0)); c.stroke();
      c.font = 'bold 20px sans-serif'; c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'bottom'; c.lineJoin = 'round'; c.lineWidth = 4; c.strokeStyle = 'rgba(0,0,0,.75)';
      const lab = (t, x, y) => { c.strokeText(t, x, y); c.fillText(t, x, y); }; lab('ネット', px(0), py(0) - 8);
      c.textBaseline = 'middle'; c.textAlign = 'right'; lab('左', px(-3.05) - 8, py(3.35)); c.textAlign = 'left'; lab('右', px(3.05) + 8, py(3.35));
    }
  };
  const bs = [...document.querySelectorAll('#names button')];
  const 選ぶ = (名) => { if (!bs.some((b) => b.dataset.n === 名)) 名 = bs.find((b) => !b.classList.contains('avg'))?.dataset.n; if (!名) return; bs.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.n === 名))); 描く(名); };
  bs.forEach((b) => b.addEventListener('click', () => { 選ぶ(b.dataset.n); document.querySelectorAll('.card.mark').forEach((e) => e.classList.remove('mark')); try { history.replaceState(null, '', '#' + encodeURIComponent(b.dataset.n)); } catch (e) {} }));
  // #名 か #名|図(図 = 相手サーブ③ など)。図があれば、その図までスクロールして枠を目立たせる
  let 初 = ''; try { 初 = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
  const [名0, 図0] = 初.split('|');
  選ぶ(名0);
  const 的 = 図0 && document.getElementById('f-' + 図0);
  const 固定 = () => document.documentElement.style.setProperty('--pin', document.getElementById('pin').offsetHeight + 'px');   // 固定部分の高さ(図が下に隠れないように)
  固定(); addEventListener('resize', 固定);
  if (的) { 的.classList.add('mark'); const b = document.querySelector('#names button[aria-pressed="true"]'); if (b) b.scrollIntoView({ block: 'nearest', inline: 'center' }); setTimeout(() => 的.scrollIntoView({ block: 'start' }), 0); }
})();
</script>
