<script>

  const 種別 = qs.get('src') || (location.pathname.startsWith('/kouhyou-preview') ? 'mp4' : 'yt');
  const P = { time: () => 0, seek() {}, play() {}, pause() {}, paused: () => true, setRate() {}, rate: 1, ready: false };

  function ytを作る() {
    const host = document.createElement('div'); host.id = 'ytp'; $('vhost').appendChild(host);
    let pl = null, 最後 = -1, 壁 = 0, 基 = 0;
    const 始める = () => {

        playerVars: { controls: 簡 ? 1 : 0, disablekb: 簡 ? 0 : 1, fs: 0, rel: 0, modestbranding: 1, playsinline: 1, iv_load_policy: 3, start: Math.floor(hashT ?? 0), origin: location.origin },
        events: { onReady: () => { P.ready = true; $('loading').style.display = 'none'; if (hashT != null) { pl.seekTo(hashT - M.頭, true); $("bigplay").hidden = true; } 状態(); }, onStateChange: 状態 },

    P.paused = () => !pl || !pl.getPlayerState || ![1, 3].includes(pl.getPlayerState());

    P.seek = (t) => { if (pl && pl.seekTo) { 最後 = -1; pl.seekTo(Math.max(0, t - M.頭), true); } };

      const 数 = 中.filter(([, i]) => 筋 == null || 残.has(i)).length;
      const 勝 = g.勝者 === '左' ? '左の勝ち' : g.勝者 === '右' ? '右の勝ち' : g.勝者 ? '引き分け' : '';
      h += '<div class="game" data-g="' + g.g + '"' + (数 ? '' : ' hidden') + '><div class="game-h"><b>ゲーム' + g.g + '</b>'
        + (g.最終 ? '<span class="fin">' + g.最終[0] + ' - ' + g.最終[1] + '</span>' : '') + '<span class="fnote">' + 勝 + (筋 != null ? '・' + 数 + '本' : '') + '</span></div>'
        + '<div class="game-teams">左 ' + esc(g.左.join('・')) + '<br>右 ' + esc(g.右.join('・')) + '</div><div class="rl">'
        + 中.map(([r, i]) => '<button class="rb" data-r="' + i + '"' + (筋 == null || 残.has(i) ? '' : ' hidden') + '><span class="n">' + r[3] + '本目</span>'
          + '<span class="s">' + (r[6] === 0 ? '<i>' + r[4] + '</i>' : r[4]) + '-' + (r[6] === 1 ? '<i>' + r[5] + '</i>' : r[5]) + '</span>'
          + (筋 != null && 最高.has(i) && 最高.get(i) >= 0 ? '<span class="m">' + 最高.get(i) + '点</span>' : '') + '</button>').join('')
        + '</div></div>';
    }
    $('games').innerHTML = h;
    印を更新(true);
  }

  function ラリー探す(t) { let k = -1; const R = M.ラリー; for (let q = 0; q < R.length; q++) { if (R[q][0] - 0.3 <= t) k = q; else break; } return k; }

  function 印を更新(強) {
    const t = P.time(); const k = ラリー探す(t);
    const 中 = k >= 0 && t <= M.ラリー[k][1] + 25 ? k : -1;
    if (!強 && 中 === 今ラリー) return;
    今ラリー = 中;
    for (const e of document.querySelectorAll('.rb.now')) e.classList.remove('now');
    if (中 >= 0) document.querySelector('.rb[data-r="' + 中 + '"]')?.classList.add('now');
  }

  function 今の表示() {
    const t = P.time(), k = ラリー探す(t);
    let s = '<span><b>' + mmss(t) + '</b></span>';
    if (k >= 0 && t <= M.ラリー[k][1] + 25) { const r = M.ラリー[k]; s += '<span>ゲーム' + r[2] + ' ・ ' + r[3] + '本目</span>'; }
    if (s !== 文) { $('now').innerHTML = s; 文 = s; }
  }

  // ================= OSD =================
  const 窓 = 0.6;
  let 前時刻 = -1, 前パネル = '';
  function 位置(p, t) {
    const T = p[5], s = (t - p[0]) * 100;
    let a = T[0], b = T[T.length - 1];
    if (s <= T[0][0]) return T[0].slice(1);
    if (s >= T[T.length - 1][0]) return T[T.length - 1].slice(1);
    for (let i = 0; i < T.length - 1; i++) if (s >= T[i][0] && s <= T[i + 1][0]) { a = T[i]; b = T[i + 1]; break; }
    const w = (s - a[0]) / Math.max(1, b[0] - a[0]);
    return [a[1] + (b[1] - a[1]) * w, a[2] + (b[2] - a[2]) * w, a[3] + (b[3] - a[3]) * w];
  }
  function 二分(A, t) { let lo = 0, hi = A.length; while (lo < hi) { const m = (lo + hi) >> 1; if (A[m][0] < t) lo = m + 1; else hi = m; } return lo; }

  function 得点を描く(t) {
    const R = M.ラリー, k = ラリー探す(t), el = $('score');
    if (k < 0) { el.style.display = 'none'; return; }
    const r = R[k], g = M.ゲーム.find((x) => x.g === r[2]);
    if (t > r[1] + 25 || (g && t < g.a - 3)) { el.style.display = 'none'; return; }
    const 前 = k > 0 && R[k - 1][2] === r[2] ? [R[k - 1][4], R[k - 1][5]] : [0, 0];
    const 決 = t >= r[1], 点 = 決 ? [r[4], r[5]] : 前;
    const 勝 = 決 && t < r[1] + 2.5 ? r[6] : -1;
    const h = '<span' + (勝 === 0 ? ' class="win"' : '') + '>' + 点[0] + '</span><span class="sep">-</span><span' + (勝 === 1 ? ' class="win"' : '') + '>' + 点[1] + '</span>';
    if (el.dataset.h !== h) { el.innerHTML = h; el.dataset.h = h; }
    el.style.display = 'flex';
  }

  function 輪を描く(t) {
    const j = 二分(M.プレー, t - 窓 - 0.01);
    const 近 = [];
    for (let i = j; i < M.プレー.length && M.プレー[i][0] <= t + 窓; i++) { const p = M.プレー[i]; if (Math.abs(p[0] - t) <= 窓 && (筋 == null || true)) 近.push(p); }
    const key = 近.map((p) => p[0] + p[1]).join();
    const W = 960, H = 540;
    let rings = '', tags = [];
    for (const p of 近) {
      const [cx, top, bot] = 位置(p, t); const hh = bot - top, ww = hh * 0.55;
      const L = (cx - ww / 2) / W * 100, Tp = (top - hh * 0.08) / H * 100, Wd = ww / W * 100, Ht = hh * 1.12 / H * 100;
      const 級 = p[3] >= 8.5 ? 'sfp' : p[3] >= 7 ? 'fp' : (p[3] >= 0 && p[3] < 3) ? 'kd' : '';
      const u = Math.min(1, Math.max(0, (t - p[0] + 窓) / (2 * 窓)));
      if (級 === 'sfp' || 級 === 'fp') {
        for (const d of 級 === 'sfp' ? [0, .35] : [0]) { const v = (u + d) % 1, 径 = hh * (0.4 + 0.8 * v) / W * 100;
          rings += '<i class="fx ' + 級 + '" style="left:' + (cx / W * 100).toFixed(2) + '%;top:' + ((top + hh * 0.45) / H * 100).toFixed(2) + '%;width:' + 径.toFixed(2) + '%;aspect-ratio:1;opacity:' + (0.6 * (1 - v)).toFixed(2) + '"></i>'; }
      } else if (級 === 'kd') {
        rings += '<i class="fx kd" style="left:' + (cx / W * 100).toFixed(2) + '%;top:' + (bot / H * 100).toFixed(2) + '%;width:' + (ww * 1.3 / W * 100).toFixed(2) + '%;opacity:' + (0.6 * Math.sin(Math.PI * u)).toFixed(2) + '"></i>';
      }
      tags.push({ x: cx / W * 100, y: (top - hh * 0.08) / H * 100, 級, 文: esc(M.名[p[1]]) + ' ' + esc(M.種[p[2]]) + (細点 ? (p[3] >= 0 ? '<i>' + p[3] + '点</i>' : '') : 級 === 'sfp' ? '<i>Excellent!</i>' : 級 === 'fp' ? '<i>Good!</i>' : 級 === 'kd' ? '<i>Try again</i>' : '') });
    }
    const box = $('rings');
    box.innerHTML = rings + tags.map((g, i) => '<span class="tag ' + g.級 + '" data-i="' + i + '" style="left:' + g.x.toFixed(2) + '%;top:' + g.y.toFixed(2) + '%">' + g.文 + '</span>').join('');
    // 札が画面の外・重なりにならないよう、横は内側へ、重なったら上へずらす
    const vb = $('vbox'), VW = vb.clientWidth, VH = vb.clientHeight, placed = [];
    for (const e of box.querySelectorAll('.tag')) {
      const w = e.offsetWidth, h = e.offsetHeight; let x = parseFloat(e.style.left) / 100 * VW, y = parseFloat(e.style.top) / 100 * VH;
      x = Math.min(Math.max(x, w / 2 + 3), VW - w / 2 - 3); y = Math.max(y, h + 3);
      for (let n = 0; n < 4; n++) { const hit = placed.find((q) => Math.abs(q.x - x) < (q.w + w) / 2 && Math.abs(q.y - y) < h + 1); if (!hit) break; y = hit.y - h - 2; if (y < h + 3) { y = hit.y + h * 2 + 6; } }
      placed.push({ x, y, w }); e.style.left = x + 'px'; e.style.top = y + 'px';
    }
  }

  // ---- コート図(小さく・右上。ボタンで出す。既定で出す) ----
  let CT = null, 読み中 = false, 出す = true;
  const 道具 = {};
  function コートを作る() {
    const c = $('court');
    c.innerHTML = '<svg viewBox="-10.6 -4.7 21.2 9.4"><rect x="-6.7" y="-3.05" width="13.4" height="6.1" fill="rgba(200,140,60,.22)" stroke="#fff" stroke-width=".06"/>'
      + '<line x1="0" y1="-3.4" x2="0" y2="3.4" stroke="#fff" stroke-width=".12"/><line x1="-1.98" y1="-3.05" x2="-1.98" y2="3.05" stroke="rgba(255,255,255,.45)" stroke-width=".04"/><line x1="1.98" y1="-3.05" x2="1.98" y2="3.05" stroke="rgba(255,255,255,.45)" stroke-width=".04"/>'
      + '<g id="ctrail"></g><g id="cppl"></g><g id="cball"></g></svg>'
      + '<svg viewBox="-10.6 -5.2 21.2 5.6"><line x1="-9.6" y1="0" x2="9.6" y2="0" stroke="#fff" stroke-width=".08"/><line x1="-6.7" y1="-.25" x2="-6.7" y2=".25" stroke="#fff" stroke-width=".08"/><line x1="6.7" y1="-.25" x2="6.7" y2=".25" stroke="#fff" stroke-width=".08"/>'
      + '<line x1="0" y1="0" x2="0" y2="-2.2" stroke="#fff" stroke-width=".12"/><line x1="-.3" y1="-2.2" x2=".3" y2="-2.2" stroke="#fff" stroke-width=".12"/><g id="sppl"></g><g id="sball"></g></svg>';
    for (const id of ['ctrail', 'cppl', 'cball', 'sppl', 'sball']) 道具[id] = c.querySelector('#' + id);
  }
  async function コートを読む() {
    if (CT || 読み中) return; 読み中 = true; $('court').innerHTML = '<div style="font:600 12px sans-serif;color:#cfd9e0;padding:6px">コート図を読み込み中…</div>';
    try { const r = await fetch(document.body.dataset.osd.replace(/\.json$/, '_court.json')); CT = await r.json(); コートを作る(); 前時刻 = -1; } catch { 読み中 = false; $('bCourt').textContent = 'コート図を読めません'; }
  }
  function コートを描く(t) {
    if (!CT || !道具.cppl) return;
    const i = 二分(CT.人, t), A = CT.人[i - 1], B = CT.人[i]; const 女 = new Set(M.女);
    let ps = [];
    if (A && t - A[0] < 1.5) {
      const w = B && B[0] > A[0] && B[0] - A[0] < 1.5 ? (t - A[0]) / (B[0] - A[0]) : 0;
      ps = A[1].map(([n, x, y, 顔]) => { const q = w ? B[1].find((z) => z[0] === n) : null; return q ? [n, x + (q[1] - x) * w, y + (q[2] - y) * w, 顔] : [n, x, y, 顔]; });
    }
    const 今 = new Set(); { const j = 二分(M.プレー, t - 窓); for (let q = j; q < M.プレー.length && M.プレー[q][0] <= t + 窓; q++) 今.add(M.プレー[q][1]); }
    道具.cppl.innerHTML = ps.map(([n, x, y, 顔]) => {
      const nm = M.名[n], hi = 今.has(n), c = !顔 ? '#9a9a9a' : 女.has(nm) ? '#FF7AB8' : '#4FA3FF';
      return (hi ? '<circle cx="' + x + '" cy="' + (-y) + '" r=".62" fill="none" stroke="#FFD23F" stroke-width=".16"/>' : '') + '<circle cx="' + x + '" cy="' + (-y) + '" r="' + (hi ? .34 : .28) + '" fill="' + c + '" stroke="#000" stroke-width=".05"/>'
        + '<text x="' + x + '" y="' + (-y - .42) + '" font-size="' + (hi ? .72 : .6) + '" font-weight="800" text-anchor="middle" fill="' + (hi ? '#FFD23F' : '#fff') + '" stroke="rgba(0,0,0,.75)" stroke-width=".12" paint-order="stroke">' + esc(nm) + '</text>';
    }).join('');
    道具.sppl.innerHTML = ps.map(([n, x, , 顔]) => { const nm = M.名[n], c = !顔 ? '#9a9a9a' : 女.has(nm) ? '#FF7AB8' : '#4FA3FF'; return '<line x1="' + x + '" y1="0" x2="' + x + '" y2="-1.7" stroke="' + c + '" stroke-width=".22" stroke-linecap="round"/>'; }).join('');
    const R = CT.球.find((r) => t >= r[0] - 0.2 && t <= r[1] + 1.2);
    let tr = '', b1 = '', b2 = '';
    if (R) {
      const pts = R[3], k = Math.max(0, 二分(pts, t + 0.001) - 1), p = pts[k], 尾 = pts.filter((q) => q[0] <= t && q[0] >= t - 1.2);
      if (尾.length > 1) tr = '<polyline points="' + 尾.map((q) => q[1] + ',' + (-q[2])).join(' ') + '" fill="none" stroke="rgba(255,40,40,.9)" stroke-width=".16"/>';
      if (p && Math.abs(p[0] - t) < 0.3) {
        const 後 = R[2] ? t > R[2][0] + 0.06 : t > R[1], col = 後 ? '#B0B0B0' : '#FF2A2A';
        b1 = '<circle cx="' + p[1] + '" cy="' + (-p[2]) + '" r=".5" fill="' + col + '" stroke="#fff" stroke-width=".14"/>';
        b2 = '<circle cx="' + p[1] + '" cy="' + (-p[3]) + '" r=".5" fill="' + col + '" stroke="#fff" stroke-width=".14"/>';
      }
    }
    道具.ctrail.innerHTML = tr; 道具.cball.innerHTML = b1; 道具.sball.innerHTML = b2;
  }
  function コートボタン() { $('bCourt').classList.toggle('on', 出す); $('bCourt').textContent = 出す ? 'コート図を消す' : 'コート図を出す'; $('court').style.display = 出す ? 'block' : 'none'; }

  function 回す() {
    if (M && P.ready) {
      const t = P.time();
      if (Math.abs(t - 前時刻) > 0.02 || 前時刻 < 0) { 前時刻 = t; 得点を描く(t); 輪を描く(t); 今の表示(); if (出す) コートを描く(t); }
    }
    requestAnimationFrame(回す);
  }
  setInterval(() => { if (M && P.ready) 印を更新(false); }, 400);

  // ================= 操作 =================
  function 飛ぶ(t, 再生 = true) {
    P.seek(Math.max(0, t)); 前時刻 = -1;
    if (再生) { P.play(); $('bigplay').hidden = true; }
    // 画面が一覧の途中にいるときは、動画が見える位置へ(スマホ縦で動画が貼りつかないとき用)
    const r = $('stage').getBoundingClientRect(); if (r.top < -4 || r.bottom < 80) $('stage').scrollIntoView({ block: 'start', behavior: 'smooth' });
    setTimeout(状態, 300);
  }
  function ラリーへ(i) { 飛ぶ(M.ラリー[i][0] - 2); }
  function 前後(d) {
    const t = P.time(); const L = 絞りラリー; if (!L.length) return;
    if (d > 0) { const i = L.find((q) => M.ラリー[q][0] - 2 > t + 0.5); if (i != null) ラリーへ(i); }
    else { const c = L.filter((q) => M.ラリー[q][0] - 2 < t - 1.5); if (c.length) ラリーへ(c[c.length - 1]); else ラリーへ(L[0]); }
  }
  const 速さ = [1, 0.5, 0.25]; let 速i = 0;
  const 速さボタン = () => { $('bRate').textContent = '速さ ×' + 速さ[速i]; };

  function 全画面() {
    const st = $('stage');
    const 今 = document.fullscreenElement || document.webkitFullscreenElement;
    if (今) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
    if (st.classList.contains('fs')) { st.classList.remove('fs'); document.body.style.overflow = ''; $('bFsT').textContent = '全画面'; return; }
    const f = st.requestFullscreen || st.webkitRequestFullscreen;
    if (f) { f.call(st).catch?.(() => 擬似全画面()); } else 擬似全画面();
  }
  function 擬似全画面() { $('stage').classList.add('fs'); document.body.style.overflow = 'hidden'; $('bFsT').textContent = '全画面をやめる'; 前時刻 = -1; }
  const fsChange = () => { const on = !!(document.fullscreenElement || document.webkitFullscreenElement); $('bFsT').textContent = on ? '全画面をやめる' : '全画面'; 前時刻 = -1; };
  document.addEventListener('fullscreenchange', fsChange); document.addEventListener('webkitfullscreenchange', fsChange);

  function 結ぶ() {
    const 切替 = () => { if (P.paused()) { P.play(); $('bigplay').hidden = true; } else P.pause(); setTimeout(状態, 200); };
    $('bPlay').onclick = 切替; $('bigplay').onclick = 切替;
    // 動画を長押し=押している間だけ2倍速(YouTube と同じ)。短く押す=再生/停止
    { const tap = $('tap'); let 押 = 0, 長 = false, 元 = 1;
      const 離す = () => { clearTimeout(押); if (長) { P.setRate(元); $('fast').style.display = 'none'; } };
      tap.addEventListener('pointerdown', () => { 長 = false; clearTimeout(押); 押 = setTimeout(() => { 長 = true; 元 = P.rate; P.setRate(2); if (P.paused()) { P.play(); $('bigplay').hidden = true; } $('fast').style.display = 'block'; }, 450); });
      for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) tap.addEventListener(ev, 離す);
      tap.addEventListener('contextmenu', (e) => e.preventDefault());
      tap.onclick = () => { if (長) { 長 = false; return; } 切替(); }; }
    $('bBack').onclick = () => 飛ぶ(P.time() - 10, !P.paused());
    $('bFwd').onclick = () => 飛ぶ(P.time() + 10, !P.paused());
    $('bPrev').onclick = () => 前後(-1); $('bNext').onclick = () => 前後(1);
    $('bFs').onclick = 全画面;
    $('bRate').onclick = () => { 速i = (速i + 1) % 速さ.length; P.setRate(速さ[速i]); 速さボタン(); };
    $('bCourt').onclick = () => { 出す = !出す; コートボタン(); if (出す) { コートを読む(); } 前時刻 = -1; };
    $('games').onclick = (e) => { const b = e.target.closest('.rb'); if (b) ラリーへ(Number(b.dataset.r)); };
    document.addEventListener('keydown', (e) => {
      if (簡 || e.target.matches('input,textarea')) return;
      if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); } else if (e.key === 'ArrowLeft') $('bBack').click(); else if (e.key === 'ArrowRight') $('bFwd').click();
      else if (e.key === '[') $('bPrev').click(); else if (e.key === ']') $('bNext').click(); else if (e.key === 'f') 全画面();
    });
  }

  // ================= 起動 =================
  (async () => {
    try {
      M = await (await fetch(document.body.dataset.osd, { cache: 'no-cache' })).json();
    } catch { $('loading').textContent = '分析のデータを読めませんでした'; return; }
    if (細点 && 細点.length === M.プレー.length) M.プレー.forEach((p, i) => { p[3] = 細点[i]; });   // 管理者用: 区分ではなく細かい点で
    if (種別 === 'mp4') mp4を作る(); else ytを作る();
    絞りを作る(); ラリーの一覧(); 結ぶ(); 状態(); 速さボタン(); コートボタン(); if (出す) コートを読む();
    if (P.ready === false && 種別 === 'mp4') {} // loadedmetadata で ready
    requestAnimationFrame(回す);
  })();
})();
</script>
</body>
